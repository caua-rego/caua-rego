<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Cauã Rêgo — Software Architect">
  <defs>
    <radialGradient id="parch" cx="45%" cy="45%" r="75%">
      <stop offset="0" stop-color="#f6ecd6"/>
      <stop offset="0.65" stop-color="#ead9b4"/>
      <stop offset="1" stop-color="#c9ab78"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7a5230" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="16" y="16" width="1168" height="328"/></clipPath>
    <style>
      .ink{fill:none;stroke:#5a3a1c;stroke-linecap:round}
      .draw{}
      .fade{}
      .rot{transform-origin:900px 180px;animation:rot 90s linear infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes fade{to{opacity:1}}
      @keyframes rot{to{transform:rotate(360deg)}}
      .serif{font-family:'Cormorant Garamond','EB Garamond',Garamond,Georgia,'Times New Roman',serif}
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#parch)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- compass construction: circle + square (proportion study) -->
  <g clip-path="url(#frame)"><g class="rot" opacity=".22">
    <circle class="ink" cx="900" cy="180" r="168" stroke-width="1" stroke-dasharray="3 6"/>
    <rect class="ink" x="759" y="39" width="282" height="282" stroke-width="1"/>
    <path class="ink" d="M732 180H1068M900 12V348M781 61L1019 299M1019 61L781 299" stroke-width=".6"/>
  </g></g>

  <!-- golden rectangle subdivisions -->
  <g class="ink fade" stroke-width=".9" stroke-opacity=".45" style="animation-delay:.2s">
    <rect x="735.0" y="40.0" width="280.0" height="280.0"/>
    <rect x="1015.0" y="40.0" width="173.0" height="173.0"/>
    <rect x="1081.1" y="213.0" width="107.0" height="107.0"/>
    <rect x="1015.0" y="253.9" width="66.1" height="66.1"/>
    <rect x="1015.0" y="213.0" width="40.9" height="40.9"/>
    <rect x="1055.9" y="213.0" width="25.2" height="25.2"/>
    <rect x="1065.5" y="238.3" width="15.6" height="15.6"/>
  </g>

  <!-- golden spiral -->
  <path class="draw" fill="none" stroke="#a3341f" stroke-width="2.2" stroke-linecap="round"
        d="M735.0,320.0 A280.0,280.0 0 0 1 1015.0,40.0 A173.0,173.0 0 0 1 1188.0,213.0 A107.0,107.0 0 0 1 1081.1,320.0 A66.1,66.1 0 0 1 1015.0,253.9 A40.9,40.9 0 0 1 1055.9,213.0 A25.2,25.2 0 0 1 1081.1,238.3 A15.6,15.6 0 0 1 1065.5,253.9 A9.6,9.6 0 0 1 1055.9,244.3 A6.0,6.0 0 0 1 1061.8,238.3"/>

  <!-- marginalia -->
  <g class="serif fade" fill="#7a5230" font-size="13" font-style="italic" style="animation-delay:1.2s">
    <text x="742" y="34">φ = 1,618…</text>
    <text x="1022" y="34">a : b = (a+b) : a</text>
    <text x="742" y="340">fig. I — proporção da casa</text>
  </g>

  <!-- title block -->
  <g class="serif">
    <text x="64" y="92" font-size="15" letter-spacing="6" fill="#7a5230" class="fade">CODEX · MMXXVI · RECIFE</text>
    <text x="60" y="170" font-size="74" font-weight="600" fill="#2b1d0e" class="fade" style="animation-delay:.25s">Cauã Rêgo</text>
    <path d="M64 192H560" stroke="#b8893b" stroke-width="1.6" class="fade" style="animation-delay:.45s"/>
    <circle cx="312" cy="192" r="4" fill="#a3341f" class="fade" style="animation-delay:.45s"/>
    <text x="64" y="232" font-size="28" font-style="italic" fill="#3d2814" class="fade" style="animation-delay:.6s">Software Architect</text>
    <text x="64" y="266" font-size="17" letter-spacing="1.5" fill="#5a3a1c" class="fade" style="animation-delay:.8s">Sistemas distribuídos · Event-driven · Performance · iGaming</text>
    <text x="64" y="316" font-size="14" letter-spacing="5" fill="#1f3a6b" class="fade" style="animation-delay:1s">FIRMITAS · UTILITAS · VENUSTAS</text>
  </g>

  <rect x="10" y="10" width="1180" height="340" fill="none" stroke="#7a5230" stroke-opacity=".5" stroke-width="1.2"/>
  <rect x="16" y="16" width="1168" height="328" fill="none" stroke="#b8893b" stroke-opacity=".6" stroke-width=".6"/>
</svg>
