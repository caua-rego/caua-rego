<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230">
  <title>Caça-níquel</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D0A10"/>
      <stop offset="100%" stop-color="#14060A"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="60%" stop-color="#DC143C"/>
      <stop offset="100%" stop-color="#7A0B1E"/>
    </radialGradient>
    <clipPath id="r1"><rect x="60" y="72" width="106" height="96" rx="10"/></clipPath>
    <clipPath id="r2"><rect x="187" y="72" width="106" height="96" rx="10"/></clipPath>
    <clipPath id="r3"><rect x="314" y="72" width="106" height="96" rx="10"/></clipPath>
  </defs>

  <!-- corpo -->
  <rect x="30" y="26" width="420" height="178" rx="20" fill="url(#body)" stroke="#D4AF37" stroke-width="4"/>

  <!-- alavanca -->
  <line x1="456" y1="130" x2="456" y2="82" stroke="#B8B8B8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="456" cy="76" r="11" fill="url(#knob)" stroke="#7A0B1E" stroke-width="1.5"/>
  <circle cx="453" cy="130" r="9" fill="#D4AF37" stroke="#8A6A1C" stroke-width="1.5"/>

  <!-- letreiro -->
  <rect x="90" y="8" width="300" height="44" rx="12" fill="url(#marquee)" stroke="#D4AF37" stroke-width="2.5"/>
  <text x="240" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="23" letter-spacing="6" fill="#FFD700">★ JACKPOT ★<animate attributeName="opacity" values="0.7;1;0.7" dur="1.4s" repeatCount="indefinite"/></text>

  <!-- janelas dos rolos -->
  <rect x="60" y="72" width="106" height="96" rx="10" fill="#0B0E13" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="187" y="72" width="106" height="96" rx="10" fill="#0B0E13" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="314" y="72" width="106" height="96" rx="10" fill="#0B0E13" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- rolo 1 -->
  <g clip-path="url(#r1)" font-family="Arial, sans-serif" font-weight="bold" font-size="44" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -240" dur="0.85s" repeatCount="indefinite"/>
      <text x="113" y="110" fill="#FFD700">7</text>
      <text x="113" y="158" fill="#E3243B">♥</text>
      <text x="113" y="206" fill="#FFD700">★</text>
      <text x="113" y="254" fill="#E3243B">♦</text>
      <text x="113" y="302" fill="#E8E8E8">♠</text>
      <text x="113" y="350" fill="#FFD700">7</text>
      <text x="113" y="398" fill="#E3243B">♥</text>
      <text x="113" y="446" fill="#FFD700">★</text>
    </g>
  </g>

  <!-- rolo 2 -->
  <g clip-path="url(#r2)" font-family="Arial, sans-serif" font-weight="bold" font-size="44" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -240" dur="1.05s" repeatCount="indefinite"/>
      <text x="240" y="110" fill="#E3243B">♦</text>
      <text x="240" y="158" fill="#FFD700">7</text>
      <text x="240" y="206" fill="#E8E8E8">♠</text>
      <text x="240" y="254" fill="#FFD700">★</text>
      <text x="240" y="302" fill="#E3243B">♥</text>
      <text x="240" y="350" fill="#E3243B">♦</text>
      <text x="240" y="398" fill="#FFD700">7</text>
      <text x="240" y="446" fill="#E8E8E8">♠</text>
    </g>
  </g>

  <!-- rolo 3 -->
  <g clip-path="url(#r3)" font-family="Arial, sans-serif" font-weight="bold" font-size="44" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -240" dur="1.25s" repeatCount="indefinite"/>
      <text x="367" y="110" fill="#E8E8E8">♠</text>
      <text x="367" y="158" fill="#E3243B">♦</text>
      <text x="367" y="206" fill="#FFD700">7</text>
      <text x="367" y="254" fill="#E3243B">♥</text>
      <text x="367" y="302" fill="#FFD700">★</text>
      <text x="367" y="350" fill="#E8E8E8">♠</text>
      <text x="367" y="398" fill="#E3243B">♦</text>
      <text x="367" y="446" fill="#FFD700">7</text>
    </g>
  </g>

  <!-- linha de pagamento -->
  <line x1="52" y1="120" x2="428" y2="120" stroke="#DC143C" stroke-width="3">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- luzes laterais -->
  <g fill="#FFD700">
    <circle cx="44" cy="86" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="114" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.22s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="142" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.44s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="170" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.66s" repeatCount="indefinite"/></circle>
    <circle cx="436" cy="86" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.11s" repeatCount="indefinite"/></circle>
    <circle cx="436" cy="114" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.33s" repeatCount="indefinite"/></circle>
    <circle cx="436" cy="142" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.55s" repeatCount="indefinite"/></circle>
    <circle cx="436" cy="170" r="4.5"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" begin="0.77s" repeatCount="indefinite"/></circle>
  </g>

  <!-- placa inferior -->
  <text x="240" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#D4AF37" opacity="0.9">GGR · NGR · TURNOVER · HOLD · LTV</text>
</svg>
